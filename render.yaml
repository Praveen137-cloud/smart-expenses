services:
  - type: web
    name: smart-expense-tracker
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python backend/train_classifier.py
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
